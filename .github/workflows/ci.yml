name: CI

on:
  push:
    branches:
      - main
      - master
      - 'implementation/**'
  pull_request:
    branches:
      - main
      - master
      - 'implementation/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build and extension verification
        run: npm run build
